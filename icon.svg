<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#166534"/>
  <circle cx="256" cy="256" r="210" fill="#15803d" opacity="0.4"/>
  <!-- Decorative Agriculture Plant Sprout & Wheat Stalk -->
  <g transform="translate(136, 110)">
    <!-- Main stem -->
    <path d="M120 280 C120 180, 120 100, 120 30" stroke="#86efac" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Left Leaf -->
    <path d="M120 220 C60 210, 20 160, 30 110 C80 110, 115 170, 120 220 Z" fill="#4ade80"/>
    <path d="M120 220 C80 170, 50 140, 30 110" stroke="#166534" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Right Leaf -->
    <path d="M120 160 C180 150, 220 100, 210 50 C160 50, 125 110, 120 160 Z" fill="#22c55e"/>
    <path d="M120 160 C160 110, 190 80, 210 50" stroke="#166534" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Wheat grain spikes at top -->
    <ellipse cx="120" cy="25" rx="14" ry="24" fill="#fef08a"/>
    <ellipse cx="102" cy="50" rx="12" ry="20" fill="#fde047" transform="rotate(-25 102 50)"/>
    <ellipse cx="138" cy="50" rx="12" ry="20" fill="#fde047" transform="rotate(25 138 50)"/>
    <ellipse cx="102" cy="85" rx="12" ry="20" fill="#facc15" transform="rotate(-25 102 85)"/>
    <ellipse cx="138" cy="85" rx="12" ry="20" fill="#facc15" transform="rotate(25 138 85)"/>
    <!-- Base soil waves -->
    <path d="M20 275 Q60 260 120 280 Q180 300 220 275" stroke="#fef08a" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Text Badge AESFR -->
  <text x="256" y="445" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">AESFR</text>
  <text x="256" y="475" font-family="'Noto Sans Arabic', Arial, sans-serif" font-weight="600" font-size="20" fill="#bbf7d0" text-anchor="middle">زرعی رہنمائی سندھ</text>
</svg>
